# =====================================================
# POSTGRESQL DATABASE
# =====================================================
spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:ai_chat}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}

# =====================================================
# FLYWAY MIGRATION
# =====================================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.clean-disabled=false

# =====================================================
# VECTOR STORE (PgVector)
# =====================================================
spring.ai.vectorstore.type=pgvector
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.index-type=HNSW

# =====================================================
# MULTIPART UPLOAD & VIRTUAL THREADS
# =====================================================
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
spring.threads.virtual.enabled=true

# =====================================================
# NLP SERVICE (MOCK / LIVE REST)
# =====================================================
# Mock NLP enabled by default. Set NLP_MOCK_ENABLED=false to use HttpNlpService calling NLP_SERVICE_URL
nlp.mock.enabled=${NLP_MOCK_ENABLED:true}
nlp.service.url=${NLP_SERVICE_URL:http://localhost:8000/api/nlp/analyze}

# =====================================================
# FILE STORAGE & RAG
# =====================================================
storage.upload-dir=${STORAGE_UPLOAD_DIR:uploads}
rag.retrieval.top-k=4
rag.retrieval.similarity-threshold=0.60

# =====================================================
# ASYNC TASK EXECUTION
# =====================================================
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=8
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=ai-chat-

# =====================================================
# ACTUATOR & HEALTH MONITORING
# =====================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always