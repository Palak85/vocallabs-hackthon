spring.application.name=document-qna-assistant
spring.config.import=optional:file:.env[.properties]


# =====================================================
# AI PROVIDER — activate exactly ONE block below
# =====================================================
# Change the active provider by:
#   1. Uncommenting the desired block below.
#   2. Commenting out all other blocks.
#   3. Adding the relevant pom.xml dependency.
#   4. Setting the required API key in .env.
# Java source code does NOT need to change.
# =====================================================


# ----- PROVIDER: Ollama (local, no API key) ----------
# Requires: spring-ai-starter-model-ollama in pom.xml
# Pull models first: ollama pull qwen3:4b && ollama pull nomic-embed-text
# spring.ai.model.chat=ollama
# spring.ai.model.embedding=ollama
# spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
# spring.ai.ollama.chat.model=qwen3:4b
# spring.ai.ollama.embedding.model=nomic-embed-text


# ----- PROVIDER: Google Gemini (API key required) ----
# Requires: spring-ai-starter-model-google-genai AND
#           spring-ai-starter-model-google-genai-embedding in pom.xml
spring.ai.model.chat=google-genai
spring.ai.model.embedding=google-genai
spring.ai.google.genai.api-key=${GOOGLE_API_KEY}
spring.ai.google.genai.chat.model=gemini-3.6-flash
spring.ai.google.genai.embedding.text.model=gemini-embedding-001
spring.ai.google.genai.embedding.text.dimensions=768
spring.ai.google.genai.embedding.api-key=${GOOGLE_API_KEY}
spring.ai.google.genai.project-id=dummy-project
spring.ai.google.genai.location=us-central1
spring.ai.google.genai.embedding.project-id=dummy-project
spring.ai.google.genai.embedding.location=us-central1


# ----- PROVIDER: OpenAI (API key required) -----------
# Requires: spring-ai-starter-model-openai in pom.xml
#spring.ai.model.chat=openai
#spring.ai.model.embedding=openai
#spring.ai.openai.api-key=${OPENAI_API_KEY}
#spring.ai.openai.chat.model=gpt-4o-mini
#spring.ai.openai.embedding.model=text-embedding-3-small
#spring.ai.openai.embedding.dimensions=768


# ----- PROVIDER: Anthropic Claude (API key required) -
# NOTE: Anthropic does NOT provide an embedding API.
# For embeddings, also enable the Ollama provider block
# and add spring-ai-starter-model-ollama to pom.xml.
# Requires: spring-ai-starter-model-anthropic in pom.xml
#spring.ai.model.chat=anthropic
#spring.ai.model.embedding=ollama
#spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY}
#spring.ai.anthropic.chat.options.model=claude-3-7-sonnet-20250219
#spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
#spring.ai.ollama.embedding.model=nomic-embed-text


# =====================================================
# POSTGRESQL
# =====================================================

spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# =====================================================
# FLYWAY
# =====================================================

spring.flyway.enabled=true

# =====================================================
# VECTOR STORE (PgVector)
# =====================================================

spring.ai.vectorstore.type=pgvector
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.index-type=HNSW


# =====================================================
# MULTIPART UPLOAD & SYSTEM PROPERTIES
# =====================================================
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
spring.threads.virtual.enabled=true
