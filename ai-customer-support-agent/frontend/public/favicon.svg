<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#a7f3d0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle badge -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#10b981" stroke-width="2" stroke-opacity="0.4" />

  <!-- Glowing Neural Nodes & Interconnections -->
  <g filter="url(#glow)" stroke="url(#glowGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Shield / Chip Frame -->
    <path d="M 32 10 L 48 18 L 48 36 L 32 52 L 16 36 L 16 18 Z" fill="none" opacity="0.8" />
    
    <!-- Cross circuit lines -->
    <line x1="32" y1="18" x2="32" y2="44" />
    <line x1="20" y1="26" x2="44" y2="26" />
    <line x1="20" y1="36" x2="44" y2="36" />
  </g>

  <!-- Central Luminous AI Core -->
  <circle cx="32" cy="31" r="5.5" fill="url(#coreGrad)" filter="url(#glow)" />
  <circle cx="32" cy="18" r="2.5" fill="#34d399" />
  <circle cx="32" cy="44" r="2.5" fill="#34d399" />
  <circle cx="20" cy="26" r="2.5" fill="#34d399" />
  <circle cx="44" cy="26" r="2.5" fill="#34d399" />
  <circle cx="20" cy="36" r="2.5" fill="#34d399" />
  <circle cx="44" cy="36" r="2.5" fill="#34d399" />

  <!-- Sparkle Accent -->
  <path d="M 48 12 Q 52 14 54 18 Q 52 22 48 24 Q 44 22 42 18 Q 44 14 48 12 Z" fill="#6ee7b7" opacity="0.9" />
</svg>