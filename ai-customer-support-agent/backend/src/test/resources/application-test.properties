spring.application.name=backend-test

# In-memory H2 database for unit tests
spring.datasource.url=jdbc:h2:mem:ai_chat;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Test GenAI Properties
spring.ai.google.genai.api-key=test-api-key-dummy-12345
spring.ai.google.genai.embedding.api-key=test-api-key-dummy-12345

# Exclude VectorStore auto-configuration in tests
spring.autoconfigure.exclude=org.springframework.ai.autoconfigure.vectorstore.pgvector.PgVectorStoreAutoConfiguration,org.springframework.ai.model.google.genai.autoconfigure.chat.GoogleGenAiChatAutoConfiguration,org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiEmbeddingAutoConfiguration

nlp.mock.enabled=true
nlp.service.url=http://localhost:8000/api/nlp/analyze
