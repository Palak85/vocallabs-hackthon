spring.application.name=backend-test

# In-memory H2 database for all unit & integration tests
spring.datasource.url=jdbc:h2:mem:ai_chat;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Exclude AI auto-configurations in tests
spring.autoconfigure.exclude=org.springframework.ai.autoconfigure.vectorstore.pgvector.PgVectorStoreAutoConfiguration,org.springframework.ai.autoconfigure.google.genai.GoogleGenAiAutoConfiguration,org.springframework.ai.autoconfigure.google.genai.GoogleGenAiEmbeddingAutoConfiguration

nlp.mock.enabled=true
nlp.service.url=http://localhost:8000/api/nlp/analyze
