# =========================================================
# Application
# =========================================================
spring.application.name=backend

server.port=8081


# =========================================================
# Database (PostgreSQL / H2 resilient fallback)
# =========================================================

spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./target/ai_chat;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${POSTGRES_USER:sa}
spring.datasource.password=${POSTGRES_PASSWORD:}
spring.datasource.driver-class-name=${POSTGRES_DRIVER:org.h2.Driver}


# =========================================================
# JPA / Hibernate
# =========================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true


# =========================================================
# Spring AI - Google Gemini
# =========================================================

spring.ai.google.genai.api-key=${GEMINI_API_KEY:mock_key}
spring.ai.google.genai.project-id=gen-lang-client-0900808244

# Ensure embeddings pick up the same configuration credentials
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY:mock_key}
spring.ai.google.genai.embedding.project-id=gen-lang-client-0900808244

# Gemini chat model
spring.ai.google.genai.chat.options.model=gemini-2.5-flash


# =========================================================
# Spring AI - PGVector / Vector Store Configuration
# =========================================================

spring.ai.vectorstore.pgvector.initialize-schema=false
spring.ai.vectorstore.pgvector.index-type=NONE
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE

# Exclude PGVector auto-configuration when running in embedded mode
spring.autoconfigure.exclude=org.springframework.ai.autoconfigure.vectorstore.pgvector.PgVectorStoreAutoConfiguration


# =========================================================
# NLP Service
# =========================================================

nlp.mock.enabled=${NLP_MOCK_ENABLED:false}
nlp.service.url=${NLP_SERVICE_URL:http://localhost:8000/api/nlp/analyze}

# =========================================================
# File Storage
# =========================================================
storage.upload-dir=${STORAGE_UPLOAD_DIR:uploads}

# =========================================================
# RAG / Retrieval Configuration
# =========================================================
rag.retrieval.top-k=4
rag.retrieval.similarity-threshold=0.60


# =========================================================
# Async Processing
# =========================================================

spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=8
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=ai-chat-


# =========================================================
# Actuator
# =========================================================

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always