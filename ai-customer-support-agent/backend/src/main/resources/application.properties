# =========================================================
# Application
# =========================================================
spring.application.name=backend

server.port=8080


# =========================================================
# PostgreSQL
# =========================================================

spring.datasource.url=jdbc:postgresql://localhost:5432/ai_chat
spring.datasource.username=postgres
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver


# =========================================================
# JPA / Hibernate
# =========================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# =========================================================
# Spring AI - Google Gemini
# =========================================================

spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.project-id=gen-lang-client-0900808244

# Ensure embeddings pick up the same configuration credentials
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.embedding.project-id=gen-lang-client-0900808244

# Gemini chat model
spring.ai.google.genai.chat.model=gemini-3.6-flash


# =========================================================
# Spring AI - PGVector
# =========================================================

spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.index-type=NONE
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE


# =========================================================
# NLP Service
# =========================================================

# Mock NLP for now. Set to false to use HttpNlpService calling nlp.service.url
nlp.mock.enabled=${NLP_MOCK_ENABLED:true}
nlp.service.url=${NLP_SERVICE_URL:http://localhost:8000/api/nlp/analyze}

# =========================================================
# File Storage
# =========================================================
storage.upload-dir=${STORAGE_UPLOAD_DIR:uploads}

# =========================================================
# RAG / Retrieval Configuration
# =========================================================
rag.retrieval.top-k=4
rag.retrieval.similarity-threshold=0.60


# =========================================================
# Async Processing
# =========================================================

spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=8
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=ai-chat-


# =========================================================
# Actuator
# =========================================================

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always